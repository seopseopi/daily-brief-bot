name: 아침 브리핑

on:
  schedule:
    # UTC 22:13 = KST 07:13 (다음날).
    # 목표는 07:30이지만, GitHub Actions 무료 스케줄러는 정각/정시 30분처럼
    # 몰리는 시각에 실행이 몇 시간씩 밀릴 수 있어(공식 문서 경고 사항)
    # 애매한 분(13분)으로 옮기고 여유 버퍼(17분)를 뒀다. 그래도 100% 정시
    # 보장은 안 됨 — GitHub Actions 스케줄 트리거 자체의 한계.
    - cron: "13 22 * * *"
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: 브리핑 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
