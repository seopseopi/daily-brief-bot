  <ellipse cx="961" cy="418" rx="224" ry="13" fill="#D7C6AE" opacity=".45"/>
  <g transform="translate(750 214) rotate(-7 100 95)">
    <rect y="9" width="210" height="198" rx="18" fill="#C6B8A1" opacity=".35"/>
    <rect width="210" height="198" rx="18" fill="#FFFDF7"/>
    <path d="M0 18Q0 0 18 0H192Q210 0 210 18V48H0" fill="#C1744F"/>
    <path d="M50 -8V15M160 -8V15" stroke="#22464B" stroke-width="8" stroke-linecap="round"/>
