    <rect width="188" height="148" rx="16" fill="#22464B"/>
    <g fill="none" stroke="#F3CB88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 34L28 39L37 28M23 69L28 74L37 63"/>
      <rect x="24" y="99" width="12" height="12" rx="3" stroke="#91A69D"/>
